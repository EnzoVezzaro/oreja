name: Site

# Vercel deploys site/ from main through its Git integration (production branch
# main, root directory site). This workflow is the gate in front of that deploy:
# it rejects malformed pages, broken internal links and undefined anchors before
# the change reaches production. It does not deploy; a second deploy path would
# race the Vercel integration.
#
# Vercel's Ignored Build Step (git diff HEAD^ HEAD --quiet -- .) only builds when
# site/ changed, so a workflow-only commit is checked without deploying.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check-site.py"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/check-site.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check static site structure and links
        run: python3 scripts/check-site.py
      - name: Report the check to Vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - oreja: site"
